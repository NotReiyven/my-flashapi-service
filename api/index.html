<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="sticky-header">
        <div class="header-content">
            <div class="brand" onclick="goHome()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>STEAM ARCHIVE</span>
            </div>
            
            <div class="search-container">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="search the store" autocomplete="off">
                    <div id="autocompleteDropdown" class="autocomplete-dropdown hidden"></div>
                </div>
                <button class="filter-toggle-btn" onclick="toggleFilters()" title="Advanced Filters">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
                </button>
            </div>

            <nav class="header-nav">
                <button onclick="toggleWishlistView()" class="nav-btn highlight">Saved</button>
            </nav>
        </div>

        <div id="advancedFilters" class="advanced-filters hidden">
            <div class="filter-group">
                <label>Genre</label>
                <select id="genreSelect" onchange="triggerSearch(true)">
                    <option value="">Any Genre</option>
                    <option value="Action">Action</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Indie">Indie</option>
                    <option value="RPG">RPG</option>
                    <option value="Strategy">Strategy</option>
                    <option value="Casual">Casual</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Price Range</label>
                <select id="priceSelect" onchange="triggerSearch(true)">
                    <option value="">Any Price</option>
                    <option value="free">Free to Play</option>
                    <option value="under10">Under $10</option>
                    <option value="under30">Under $30</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sort By</label>
                <select id="sortSelect" onchange="triggerSearch(true)">
                    <option value="recent">Newest First</option>
                    <option value="price_asc">Price: Low to High</option>
                    <option value="price_desc">Price: High to Low</option>
                    <option value="hidden_gem">Hidden Gems</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Developer</label>
                <input type="text" id="devInput" placeholder="Studio name..." onkeypress="if(event.key==='Enter') triggerSearch(true)">
            </div>
        </div>
    </header>

    <main class="main-wrapper">
        <div id="error-message" class="error hidden"></div>

        <div id="homeView">
            <section class="categories-section">
                <h2>Browse by Category</h2>
                <div class="category-grid">
                    <div class="cat-card" style="background-image: url('https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/730/header.jpg');" onclick="applyCategoryFilter('Action')">
                        <div class="cat-overlay"></div>
                        <span class="cat-label">Action</span>
                    </div>
                    <div class="cat-card" style="background-image: url('https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/108600/header.jpg');" onclick="applyCategoryFilter('Adventure')">
                        <div class="cat-overlay"></div>
                        <span class="cat-label">Adventure</span>
                    </div>
                    <div class="cat-card" style="background-image: url('https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/646570/header.jpg');" onclick="applyCategoryFilter('Strategy')">
                        <div class="cat-overlay"></div>
                        <span class="cat-label">Strategy</span>
                    </div>
                    <div class="cat-card" style="background-image: url('https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/413150/header.jpg');" onclick="applyCategoryFilter('Indie')">
                        <div class="cat-overlay"></div>
                        <span class="cat-label">Indie</span>
                    </div>
                    <div class="cat-card" style="background-image: url('https://shared.akamai.steamstatic.com/store_item_assets/steam/apps/1086940/header.jpg');" onclick="applyCategoryFilter('RPG')">
                        <div class="cat-overlay"></div>
                        <span class="cat-label">RPG</span>
                    </div>
                </div>
            </section>

            <div id="carouselsContainer"></div>
            
            <div class="load-more-container">
                <button id="loadMoreCarouselsBtn" onclick="loadNextCarousel()" class="load-more-btn">Load More Categories</button>
            </div>
        </div>

        <div id="searchView" class="hidden">
            <div class="section-header">
                <h2 id="searchTitle">Search Results</h2>
                <button class="nav-btn" onclick="goHome()">Clear Search</button>
            </div>
            
            <div id="backlogStats" class="backlog-stats hidden"></div>
            
            <div id="gamesList" class="grid-container"></div>
            
            <div class="load-more-container">
                <button id="loadMoreGridBtn" onclick="loadMoreSearchResults()" class="load-more-btn hidden">Load More Games</button>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-brand">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                <span>STEAM ARCHIVE</span>
            </div>
            <div class="footer-links">
                <a href="https://www.kaggle.com/datasets/fronkongames/steam-games-dataset/versions/48?resource=download" target="_blank">Dataset</a>
                <a href="https://github.com/NotReiyven" target="_blank">GitHub</a>
                <a href="https://discord.gg/Q7JTvPUEM" target="_blank">Discord</a>
            </div>
        </div>
        <div class="footer-bottom">
            <p>Steam Archive © 2026. Not affiliated with Valve Corporation.</p>
        </div>
    </footer>

    <div id="gameModal" class="modal hidden">
        <div class="modal-content" id="modalBody">
            <!-- Injected by JS -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
